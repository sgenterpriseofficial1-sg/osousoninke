
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>O SOU SONINKE</title>

  <meta name="theme-color" content="#050505">
  <meta name="description"
        content="O SOU SONINKE - Ensemble, Culture, Fierté, Style.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
    }

    /* MAIN WEBSITE */

    #mainWebsite {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* SPLASH SCREEN */

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #050505;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #splashScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* SPLASH IMAGE */

    #splashImage {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;
      background: #050505;
    }

    /* OPTIONAL LOADING ACCESSIBILITY */

    .loading-label {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);

      color: transparent;
      font-size: 1px;
    }

    /* MOBILE */

    @media screen and (max-width: 600px) {
      #splashImage {
        object-fit: contain;
      }
    }

  </style>
</head>

<body>

  <!-- MAIN O SOU SONINKE WEBSITE -->

  <iframe
    id="mainWebsite"
    src="https://osousoninke.lovable.app/"
    title="O SOU SONINKE Website">
  </iframe>


  <!-- SPLASH SCREEN -->

  <div id="splashScreen">

    <img
      id="splashImage"
      src="osousoninkesplash.png"
      alt="O SOU SONINKE - Culture, Fierté, Style">

    <span class="loading-label">
      Loading O SOU SONINKE
    </span>

  </div>


  <script>

    const splash = document.getElementById("splashScreen");
    const website = document.getElementById("mainWebsite");

    const minimumLoadingTime = 2500;
    const maximumLoadingTime = 8000;

    const startTime = Date.now();

    let websiteLoaded = false;
    let splashHidden = false;

    // Hide splash screen

    function hideSplash() {

      if (splashHidden) return;

      splashHidden = true;

      splash.classList.add("hide");

      setTimeout(() => {
        splash.style.display = "none";
      }, 900);

    }

    // Wait until the website loads

    website.addEventListener("load", () => {

      websiteLoaded = true;

      const elapsed = Date.now() - startTime;

      const remaining = Math.max(
        0,
        minimumLoadingTime - elapsed
      );

      setTimeout(hideSplash, remaining);

    });

    // Fallback if the website takes too long

    setTimeout(() => {

      if (!splashHidden) {
        hideSplash();
      }

    }, maximumLoadingTime);

  </script>

</body>
</html>
